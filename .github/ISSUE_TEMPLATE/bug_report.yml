name: Bug report / 问题反馈
description: Report a reproducible Mino issue.
body:
  - type: input
    id: version
    attributes:
      label: Mino and macOS versions
      placeholder: Mino 0.1.0, macOS 15.7, Apple silicon
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Displays and other menu bar managers
      description: Include notch, scaling, full screen, and whether another manager is running.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Redact private information from any screenshots or logs.
    validations:
      required: true
